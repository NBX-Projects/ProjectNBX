services:
  api:
    ports: !override
      - '127.0.0.1:8080:8080'
    depends_on: !override
      - livekit
      - redis
    environment:
      APP_ENV: production
      DATABASE_URL: '${DATABASE_URL:-postgres://admin:nbx_pass@nbx_db:5432/nbx_stream?sslmode=disable}'
      JWT_SECRET: '${JWT_SECRET:-super_secret_jwt_key_projectnbx_change_me_in_production}'
      LIVEKIT_URL: '${LIVEKIT_URL:-wss://nbxproject.massco.com.br}'
      LIVEKIT_API_URL: '${LIVEKIT_API_URL:-http://livekit:7880}'
      LIVEKIT_API_KEY: '${LIVEKIT_API_KEY:-devkey}'
      LIVEKIT_API_SECRET: '${LIVEKIT_API_SECRET:-secret}'
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-*}'
      AUDIT_ADMIN_USER_IDS: '${AUDIT_ADMIN_USER_IDS:-}'

  nbx_db:
    profiles:
      - local
    ports: !override []

  redis:
    image: 'redis:${REDIS_VERSION:-7-alpine}'
    ports: !override []

  livekit:
    image: 'livekit/livekit-server:${LIVEKIT_SERVER_VERSION:-latest}'
    environment:
      NODE_IP: '${LIVEKIT_NODE_IP:-127.0.0.1}'
    ports: !override
      - '7880:7880'
      - '7881:7881'
      - '50000-50020:50000-50020/udp'

  ingress:
    image: 'livekit/ingress:${LIVEKIT_INGRESS_VERSION:-latest}'

  adminer:
    profiles:
      - manual
    ports: !override []
