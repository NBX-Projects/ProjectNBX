port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: true
  stun_servers:
    - "stun.l.google.com:19302"
    - "stun1.l.google.com:19302"
  ips:
    includes:
      - "192.168.15.0/24"

keys:
  devkey: secret

logging:
  json: false
  level: info

webhook:
  api_key: devkey
  urls:
    - "http://host.docker.internal:8080/api/livekit/webhook"
