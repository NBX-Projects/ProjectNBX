services:
  # API Go Backend (ProjectNBX)
  api:
    container_name: projectnbx-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8081:8080'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: '8080'
      DATABASE_URL: 'postgres://admin:nbx_pass@nbx_db:5432/nbx_stream?sslmode=disable'
      LIVEKIT_URL: '${LIVEKIT_URL:-wss://nbxproject.massco.com.br}'
      LIVEKIT_API_KEY: '${LIVEKIT_API_KEY:-devkey}'
      LIVEKIT_API_SECRET: '${LIVEKIT_API_SECRET:-secret}'
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-*}'
      JWT_SECRET: '${JWT_SECRET:-super_secret_jwt_key_projectnbx_change_me_in_production}'
      MIGRATIONS_DIR: '/app/migrations'
    depends_on:
      - nbx_db
      - livekit
      - redis

  # Banco de Dados Relacional PostgreSQL 16
  nbx_db:
    container_name: nbx_db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '8190:5432'
    environment:
      POSTGRES_DB: nbx_stream
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: nbx_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Servidor SFU WebRTC LiveKit
  livekit:
    image: livekit/livekit-server:latest
    container_name: projectnbx-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
      NODE_IP: ""
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  # Redis para estado e sessões
  redis:
    image: redis:7-alpine
    container_name: projectnbx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Interface Web Adminer para gerenciamento do PostgreSQL
  adminer:
    image: adminer:latest
    container_name: projectnbx-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: nbx_db
    depends_on:
      - nbx_db
volumes:
  pgdata: { }
