services:
  # Banco de Dados Relacional PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: projectnbx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: projectnbx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projectnbx"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Servidor SFU WebRTC LiveKit
  livekit:
    image: livekit/livekit-server:latest
    container_name: projectnbx-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"         # Porta HTTP/WebSocket de sinalização
      - "7881:7881"         # Porta TCP WebRTC
      - "50000-50020:50000-50020/udp" # Portas UDP WebRTC
    depends_on:
      - redis

  # Redis para estado e sessões
  redis:
    image: redis:7-alpine
    container_name: projectnbx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Backend em Go (ProjectNBX API & WebSocket Hub com PostgreSQL)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectnbx-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=super_secret_jwt_key_projectnbx_change_me_in_production
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/projectnbx?sslmode=disable
      - MIGRATIONS_DIR=migrations
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - ALLOWED_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres_data:
