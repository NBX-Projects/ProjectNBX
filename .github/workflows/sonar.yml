name: SonarQube & Quality Gate Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  sonar-analysis:
    name: SonarQube Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history for Sonar blame & analysis

      # 1. Setup Flutter & Generate Coverage
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Flutter Tests & Generate LCOV
        run: flutter test --coverage

      # 2. Setup Go & Generate Coverage
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Install Go Dependencies & Run Tests
        working-directory: backend
        run: |
          go mod download
          go test -v -coverprofile=coverage.out ./... || true

      # 3. SonarCloud / SonarQube Scanner
      - name: SonarQube / SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Sonar Token Notice
        if: env.SONAR_TOKEN == ''
        run: |
          echo "⚠️ SONAR_TOKEN não configurado nos secrets do repositório GitHub."
          echo "👉 Para ativar o Quality Gate no SonarCloud/SonarQube, adicione o secret SONAR_TOKEN em Settings > Secrets and variables > Actions."
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
