name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend no Servidor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configurar chave SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/github_actions_deploy
          chmod 600 ~/.ssh/github_actions_deploy

      - name: Configurar SSH
        env:
          SSH_SERVER: ${{ secrets.SSH_SERVER }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          if [ -n "$SERVER_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            STRICT_CHECK="yes"
          else
            echo "Aviso: SERVER_KNOWN_HOSTS não definido. Utilizando StrictHostKeyChecking accept-new."
            touch ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            STRICT_CHECK="accept-new"
          fi
          cat <<EOF > ~/.ssh/config
          Host $SSH_SERVER
            User $SERVER_USER
            IdentityFile ~/.ssh/github_actions_deploy
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking $STRICT_CHECK
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Testar conexão SSH
        run: |
          ssh ${{ secrets.SSH_SERVER }} "echo 'SSH funcionando!'"

      - name: Deploy Backend via Docker Compose
        run: |
          ssh ${{ secrets.SSH_SERVER }} "
            mkdir -p ~/projetos &&
            if [ ! -d ~/projetos/ProjectNBX ]; then
              echo 'Diretório não encontrado. Clonando repositório...'
              git clone https://github.com/${{ github.repository }}.git ~/projetos/ProjectNBX || git clone git@github.com:${{ github.repository }}.git ~/projetos/ProjectNBX
            fi
            cd ~/projetos/ProjectNBX &&
            git fetch origin main &&
            git reset --hard origin/main &&
            cd backend &&
            docker compose build --no-cache api &&
            if [ -f docker-compose.prod.yml ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate
            elif [ -f docker-compose.production.yml ]; then
              docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --force-recreate
            else
              docker compose up -d --force-recreate
            fi
          "

