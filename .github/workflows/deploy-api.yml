name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend no Servidor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/github_actions_deploy
          chmod 600 ~/.ssh/github_actions_deploy

      - name: Configurar SSH
        run: |
          cat <<EOF > ~/.ssh/config
          Host ${{ secrets.SSH_SERVER }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/github_actions_deploy
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Testar conexão SSH
        run: |
          ssh ${{ secrets.SSH_SERVER }} "echo 'SSH funcionando!'"

      - name: Deploy Backend via Docker Compose
        run: |
          ssh ${{ secrets.SSH_SERVER }} "
            mkdir -p ~/projetos &&
            if [ ! -d ~/projetos/ProjectNBX ]; then
              echo 'Diretório não encontrado. Clonando repositório...'
              git clone https://github.com/${{ github.repository }}.git ~/projetos/ProjectNBX || git clone git@github.com:${{ github.repository }}.git ~/projetos/ProjectNBX
            fi
            cd ~/projetos/ProjectNBX &&
            git pull origin main &&
            cd backend &&
            docker compose build --no-cache api &&
            docker compose up -d --force-recreate
          "

