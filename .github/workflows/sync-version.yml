name: Sincronizar Versão no Pubspec

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Tag para sincronizar (ex: v1.0.10). Se vazio, usa a tag mais recente.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sync-pubspec-version
  cancel-in-progress: false

jobs:
  bump-pubspec:
    name: Atualizar pubspec.yaml na main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular versão e sincronizar pubspec.yaml
        shell: bash
        run: |
          # 1. Determina a tag acionadora
          TAG_NAME="${{ inputs.target_tag }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi

          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "Nenhuma tag encontrada para sincronizar. Finalizando."
            exit 0
          fi

          echo "Processando tag: $TAG_NAME"
          CLEAN_VER="${TAG_NAME#v}"

          # 2. Calcula a versao final com build number (+patch)
          if [[ "$CLEAN_VER" == *"+"* ]]; then
            NEW_VERSION="$CLEAN_VER"
          else
            PATCH=$(echo "$CLEAN_VER" | awk -F. '{print $3}' | sed 's/[^0-9].*//')
            if [ -n "$PATCH" ]; then
              BUILD_NUM="$PATCH"
            else
              BUILD_NUM="1"
            fi
            NEW_VERSION="${CLEAN_VER}+${BUILD_NUM}"
          fi

          echo "Nova versao calculada: $NEW_VERSION"

          # 3. Verifica versao atual no pubspec.yaml
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[ ]*//' | tr -d '\r')
          echo "Versao atual no pubspec.yaml: $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "pubspec.yaml ja esta na versao $NEW_VERSION. Nenhuma alteracao necessária."
            exit 0
          fi

          # 4. Atualiza apenas a linha version: no pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          # 5. Configura autor do commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 6. Comita e envia com [skip ci] para evitar loops e builds redundantes
          git add pubspec.yaml
          git commit -m "CHORE: sincronizar versao $NEW_VERSION no pubspec.yaml [skip ci]"

          # Rebase preventivo antes de push
          git pull --rebase origin main
          git push origin main
          echo "Sucesso: pubspec.yaml atualizado para $NEW_VERSION na branch main!"
