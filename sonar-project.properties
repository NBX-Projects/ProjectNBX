# ==============================================================================
# SonarQube / SonarCloud Configuration - ProjectNBX
# Multi-stack Project: Flutter (Dart) + Backend (Go) + PostgreSQL (SQL)
# ==============================================================================

# Project & Organization Identification
sonar.organization=nbx-projects
sonar.projectKey=NBX-Projects_ProjectNBX
sonar.projectName=ProjectNBX
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source and Test Directories
sonar.sources=lib,backend
sonar.tests=test,backend

# Inclusions and Exclusions
sonar.test.inclusions=test/**/*_test.dart,backend/**/*_test.go
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/.dart_tool/**,\
  build/**,\
  android/**,\
  ios/**,\
  web/**,\
  windows/**,\
  macos/**,\
  linux/**,\
  backend/bin/**,\
  backend/tmp/**,\
  backend/migrations/**,\
  assets/**

sonar.coverage.exclusions=\
  backend/cmd/**,\
  backend/internal/database/**,\
  backend/internal/repository/postgres_repo.go,\
  lib/main.dart,\
  lib/features/voice/services/desktop_hardware_service.dart,\
  lib/features/voice/services/audio_hardware_service.dart,\
  lib/features/voice/widgets/immersive_stream_player.dart,\
  lib/features/voice/widgets/screen_share_dialog.dart,\
  lib/features/voice/widgets/viewports/stream_preview_viewports.dart

# Coverage & Test Execution Reports
# 1. Flutter / Dart Coverage (LCOV)
sonar.dart.lcov.reportPaths=coverage/lcov.info

# 2. Go Coverage & Tests
sonar.go.coverage.reportPaths=backend/coverage.out

# Quality Gate Settings (Asynchronous processing on SonarCloud)
sonar.qualitygate.wait=false
